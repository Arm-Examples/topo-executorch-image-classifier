[project]
name = "topo-executorch-image-classifier"
version = "0.1.0"
description = "ExecuTorch + XNNPACK image classification evaluation harness for Arm Targets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "executorch==1.2.0",
    "gradio>=6.22.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "torch==2.12.1",
    "torchvision>=0.27.1",
]

[tool.uv]
# ExecuTorch declares export and test dependencies that this runtime-only image does not use.
exclude-dependencies = [
    "coremltools",
    "expecttest",
    "hydra-core",
    "hypothesis",
    "kgb",
    "parameterized",
    "pytest",
    "pytest-json-report",
    "pytest-rerunfailures",
    "pytest-xdist",
    "pytorch-tokenizers",
    "scikit-learn",
    "torchao",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
