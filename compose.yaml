services:
  classifier:
    platform: linux/arm64
    build:
      context: .
      args:
        HF_REPO_ID: Arm/vit-base-int8-xnnpack-executorch
      secrets:
        - hf_token
    ports:
      - "7860:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
secrets:
  hf_token:
    environment: HF_TOKEN
x-topo:
  name: "Image Classifier (ExecuTorch + XNNPACK)"
  description: |
    An on-device evaluation harness for compatible ExecuTorch image classification
    models that use the XNNPACK backend and are hosted on Hugging Face. Deploy the
    Project to an Arm Target, upload images through a Gradio web interface, and
    measure inference results and performance. No GPU is required.
  deployment_success_message: |
    Image Classifier (ExecuTorch + XNNPACK) is starting.

    Run `topo ps` and wait until the classifier service reports a healthy status.
    Then open http://<target-ip>:7860 in your browser to upload images.
  parameters:
    HF_REPO_ID:
      description: >-
        Hugging Face repository containing config.yaml, metadata.yaml, and an
        ExecuTorch model that uses the XNNPACK backend
      default: "Arm/vit-base-int8-xnnpack-executorch"
      example: "Arm/resnet-18-int8-xnnpack-executorch"
      hints:
        meta.type: huggingface.repo-id
        model.task: image-classification
        model.format: pte
        executorch.backend: xnnpack
