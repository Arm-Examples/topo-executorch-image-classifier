services:
  classifier:
    platform: linux/arm64
    build:
      context: .
      args:
        MODEL: Arm/vit-base-int8-xnnpack-executorch
      secrets:
        - hf_token
    ports:
      - "7860:7860"

secrets:
  hf_token:
    environment: HF_TOKEN

x-topo:
  name: "Image Classifier (ExecuTorch)"
  type: "application"
  description: |
    An on-device evaluation harness for Arm-optimised image-classification
    models. Supply any ExecuTorch image-classification .pte, deploy it to your
    own Arm device, upload your own images through a Gradio web UI, and measure
    whether it runs, how fast it is on your target, and whether it's good enough
    on your inputs. No GPU required.
  deployment_success_message: |
    Image classifier is live — open http://<target>:7860 to upload an image.
  parameters:
    MODEL:
      description: "Hugging Face repository containing config.yaml, metadata.yaml, and an ExecuTorch model"
      required: true
      default: "Arm/vit-base-int8-xnnpack-executorch"
      example: "Arm/resnet-18-int8-xnnpack-executorch"
      hints:
        huggingface.task: image-classification
        file.format: pte
