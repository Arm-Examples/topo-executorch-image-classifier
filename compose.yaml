services:
  classifier:
    platform: linux/arm64
    build:
      context: .
      args:
        MODEL: Arm/vit-base-int8-xnnpack-executorch
      secrets:
        - hf_token
    ports:
      - "7860:7860"

secrets:
  hf_token:
    environment: HF_TOKEN

x-topo:
  name: "Image Classifier (ExecuTorch)"
  description: |
    An on-device evaluation harness for compatible ExecuTorch image
    classification models hosted on Hugging Face. Deploy the Project to an Arm
    Target, upload images through a Gradio web interface, and measure inference
    results and performance. No GPU is required.
  deployment_success_message: |
    Image classifier is running. Open http://<target-ip>:7860 to upload an image.
  parameters:
    MODEL:
      description: "Hugging Face repository containing config.yaml, metadata.yaml, and an ExecuTorch model"
      default: "Arm/vit-base-int8-xnnpack-executorch"
      example: "Arm/resnet-18-int8-xnnpack-executorch"
      hints:
        huggingface.task: image-classification
        file.format: pte
